name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path "engine.py" -Pattern '^VERSION = "([^"]+)"$' | Select-Object -First 1
          if (-not $line) {
            throw "VERSION was not found in engine.py."
          }
          $version = $line.Matches[0].Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Verify release tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "v$env:APP_VERSION"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Release tag '${{ github.ref_name }}' does not match application version '$expected'."
          }

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile app.py engine.py timeline_widget.py video_preview.py audio_preview.py bootstrap.py

      - name: Build release ZIP
        shell: pwsh
        run: ./build_windows.ps1

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: PMN-003_MONTAZH-Windows-x64
          path: release/PMN-003_MONTAZH_v${{ steps.version.outputs.version }}_Windows_x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: PMN-003_MONTAZH-Windows-x64
          path: release-artifact

      - name: Publish GitHub Release without overwriting an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $expected = "v${{ needs.build.outputs.app_version }}"
          if ($tag -ne $expected) {
            throw "Release tag '$tag' does not match application version '$expected'."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$tag' already exists. Refusing to overwrite an existing release asset."
          }

          $zip = Get-ChildItem "release-artifact" -Filter "PMN-003_MONTAZH_v*_Windows_x64.zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Release ZIP was not found."
          }

          gh release create $tag $zip.FullName `
            --title "PMN-003 MONTAZH $tag" `
            --notes "Windows x64 public build of PMN-003 MONTAZH / 半自動映像構成装置. VOICEVOX or VOICEVOX Nemo is required separately."
