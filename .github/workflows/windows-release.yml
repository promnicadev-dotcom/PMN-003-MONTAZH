name: Build Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: python -m pip install -r requirements-release-build.txt

      - name: Read version
        shell: pwsh
        run: |
          $version = python -c "import engine; print(engine.VERSION)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name PMN-003_MONTAZH `
            --exclude-module imageio_ffmpeg `
            app.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Force "RELEASE_README.txt" "dist/PMN-003_MONTAZH/README.txt"
          Copy-Item -Force "THIRD_PARTY_NOTICES.txt" "dist/PMN-003_MONTAZH/THIRD_PARTY_NOTICES.txt"
          $zip = "PMN-003_MONTAZH_v$($env:APP_VERSION)_Windows_x64.zip"
          Compress-Archive -Path "dist/PMN-003_MONTAZH/*" -DestinationPath $zip -Force
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: PMN-003_MONTAZH-Windows-x64
          path: ${{ env.RELEASE_ZIP }}

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $title = "PMN-003 MONTAZH v$env:APP_VERSION"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $env:RELEASE_ZIP --target $env:GITHUB_SHA --title $title --notes "Windows x64 public build of PMN-003 MONTAZH / 半自動映像構成装置. VOICEVOX or VOICEVOX Nemo is required separately."
          } else {
            gh release upload $tag $env:RELEASE_ZIP --clobber
          }
