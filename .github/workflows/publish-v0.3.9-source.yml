name: Publish verified v0.3.9 source

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.3.9-source.yml']

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply the already-validated v0.3.9 patch
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/prepare-v0.3.9.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['prepare-release']['steps']
          step = next(item for item in steps if item.get('name') == 'Apply audited v0.3.9 maintenance fixes')
          Path('apply_v039.sh').write_text(step['run'], encoding='utf-8', newline='')
          PY
          bash apply_v039.sh
          git checkout HEAD -- .github/workflows/windows-release.yml

      - name: Commit only verified application and distribution source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py engine.py README.md README.txt RELEASE_README.txt THIRD_PARTY_NOTICES.txt build_windows.ps1 TEST_REPORT_v0.3.9.md
          git diff --cached --check
          git commit -m "Release PMN-003 MONTAZH v0.3.9 source"
          git push origin HEAD:main
