name: Retry v0.3.9 maintenance release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-v0.3.9-retry.yml']

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reuse audited v0.3.9 patch
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/prepare-v0.3.9.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['prepare-release']['steps']
          step = next(item for item in steps if item.get('name') == 'Apply audited v0.3.9 maintenance fixes')
          Path('apply_v039.sh').write_text(step['run'], encoding='utf-8', newline='')
          PY
          bash apply_v039.sh

      - name: Install regression-test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check "Pillow>=12.0.0,<13"

      - name: Syntax, regression and privacy checks
        shell: bash
        run: |
          python -m py_compile app.py engine.py timeline_widget.py video_preview.py audio_preview.py bootstrap.py
          python - <<'PY'
          from pathlib import Path
          import tempfile, zipfile, json
          import engine

          assert engine.VERSION == '0.3.9'
          assert engine.USER_SETTINGS_SCHEMA_VERSION == 2

          with tempfile.TemporaryDirectory() as td:
              root = Path(td)
              video = root / 'source.mp4'
              video.write_bytes(b'x')
              fake_ffmpeg = root / 'ffmpeg.exe'
              fake_ffmpeg.write_bytes(b'fake')
              project = root / 'sample.montazh'
              settings = engine.Settings(video=str(video), script='test', ffmpeg_path=str(fake_ffmpeg))
              engine.save_project(project, settings)
              with zipfile.ZipFile(project, 'r') as zf:
                  payload = json.loads(zf.read('project.json').decode('utf-8'))
                  assert payload['settings']['ffmpeg_path'] == ''
                  assert payload['app_version'] == '0.3.9'

              seen = {}
              original_probe = engine.probe_duration
              def fake_probe(ffmpeg, source, cancel=None):
                  seen['ffmpeg'] = ffmpeg
                  seen['source'] = source
                  return 1.0
              engine.probe_duration = fake_probe
              try:
                  loaded = engine.load_project(project, str(fake_ffmpeg))
              finally:
                  engine.probe_duration = original_probe
              assert Path(seen['ffmpeg']) == fake_ffmpeg.resolve()
              assert Path(seen['source']) == video
              assert loaded.ffmpeg_path == ''

          app_text = Path('app.py').read_text(encoding='utf-8')
          assert 'loaded = load_project(target, local_ffmpeg)' in app_text
          assert 'settings = load_project(path, local_ffmpeg)' in app_text
          assert '"ffmpeg_path": self.vars["ffmpeg_path"].get().strip()' in app_text
          assert 'elif schema == 1 and USER_SETTINGS_SCHEMA_VERSION == 2:' in app_text
          engine_text = Path('engine.py').read_text(encoding='utf-8')
          assert 'project_settings["ffmpeg_path"] = ""' in engine_text
          assert 'find_ffmpeg(ffmpeg_path)' in engine_text
          print('v0.3.9 regression checks: PASS')
          PY

          if grep -R -n -I -E 'promnicadev-dotcom|promnica\.dev@gmail\.com|C:/Users/ty091|C:\\Users\\ty091' . \
              --exclude-dir=.git --exclude='prepare-v0.3.9.yml' --exclude='prepare-v0.3.9-retry.yml' --exclude='apply_v039.sh'; then
            echo 'Public-source privacy/stale-identity scan failed.'
            exit 1
          fi

      - name: Build Windows v0.3.9 candidate
        shell: pwsh
        run: ./build_windows.ps1

      - name: Inspect release ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          release = Path('release/PMN-003_MONTAZH_v0.3.9_Windows_x64.zip')
          assert release.is_file(), release
          with zipfile.ZipFile(release, 'r') as zf:
              names = zf.namelist()
              lower = [n.lower() for n in names]
              assert any(n.endswith('/PMN-003_MONTAZH.exe') for n in names)
              assert any(n.endswith('/THIRD_PARTY_NOTICES.txt') for n in names)
              assert any('/licenses/' in n.lower() and 'opencv_' in n.lower() for n in names)
              assert any('/licenses/' in n.lower() and 'pillow_' in n.lower() for n in names)
              assert not any(n.endswith('/ffmpeg.exe') for n in lower)
              readme_name = next(n for n in names if n.endswith('/README.txt'))
              assert 'v0.3.9' in zf.read(readme_name).decode('utf-8-sig')
          print('release ZIP inspection: PASS')
          PY

      - name: Publish v0.3.9 source, tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.3.9 >/dev/null 2>&1; then
            echo 'v0.3.9 tag already exists; refusing to overwrite.'
            exit 1
          fi
          if gh release view v0.3.9 >/dev/null 2>&1; then
            echo 'v0.3.9 Release already exists; refusing to overwrite.'
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v0.3.9.yml .github/workflows/prepare-v0.3.9-retry.yml
          rm -f apply_v039.sh
          git add app.py engine.py README.md README.txt RELEASE_README.txt THIRD_PARTY_NOTICES.txt build_windows.ps1 .github/workflows/windows-release.yml TEST_REPORT_v0.3.9.md
          git commit -m "Release PMN-003 MONTAZH v0.3.9"
          release_sha=$(git rev-parse HEAD)
          git tag v0.3.9
          git push origin HEAD:main
          git push origin v0.3.9
          git push origin HEAD:refs/heads/release/v0.3.9

          gh release create v0.3.9 release/PMN-003_MONTAZH_v0.3.9_Windows_x64.zip \
            --verify-tag \
            --title "PMN-003 MONTAZH v0.3.9" \
            --notes "Final maintenance release. Includes the v0.3.8 UX-final adjustments and post-release audit fixes: custom FFmpeg project loading, machine-local FFmpeg path handling, corrected FFmpeg/OpenCV notices, bundled OpenCV/Pillow license texts, and hardened release handling. VOICEVOX or VOICEVOX Nemo and an external FFmpeg executable are required separately."
          echo "Published commit: $release_sha"
